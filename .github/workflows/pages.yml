name: docs-website

# Builds the Astro Starlight website (site pages in src/, the user guide from
# docs/ via scripts/sync-guide.mjs) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # sync-guide fails on a guide page without a title or a link to a
      # missing page; astro build fails on a broken import.
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
