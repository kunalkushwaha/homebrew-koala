<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="510" viewBox="0 0 1240 510" role="img" aria-labelledby="title desc">
<title id="title">VM states</title>
<desc id="desc">koala create or koala run starts in Creating, then Stopped once the disk is ready. koala start moves a VM through Starting to Running; Running becomes Degraded if its network is lost and returns when it recovers. koala stop, or the end of the main command, leads to Stopping. A service or environment VM returns to Stopped; a job always goes on to Deleting and Deleted. koala rm removes a Stopped or Failed VM. A failed start, or a lost VM, gives Failed, and koala start tries again.</desc>
<rect width="1240" height="510" fill="#f7f9fc"/>
<style>
 text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
 .heading { font-size:18px; font-weight:650; fill:#17304b; }
 .body { font-size:14px; fill:#465d72; }
 .eyebrow { font-size:12px; font-weight:700; letter-spacing:1.4px; fill:#476889; }
 .label { font-size:13px; fill:#334f6b; }
</style>
