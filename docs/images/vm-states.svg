<text x="885.0" y="134.0" class="heading" text-anchor="middle">Running</text>
<rect x="1030" y="100" width="170" height="56" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/>
<text x="1115.0" y="134.0" class="heading" text-anchor="middle">Degraded</text>
<rect x="800" y="260" width="170" height="56" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="885.0" y="294.0" class="heading" text-anchor="middle">Stopping</text>
<rect x="80" y="420" width="170" height="56" rx="12" fill="#eef1f4" stroke="#cfdae5" stroke-width="1.5"/>
<text x="165.0" y="454.0" class="heading" text-anchor="middle">Deleted</text>
<rect x="320" y="420" width="170" height="56" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="405.0" y="454.0" class="heading" text-anchor="middle">Deleting</text>
