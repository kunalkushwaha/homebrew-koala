<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">How Koala fits together</title>
<desc id="desc">You type koala commands. The CLI talks to a per-user Koala manager, a launchd agent that needs no sudo, over a private socket. The manager keeps images, VM disks and volumes, and runs one VM per workload: a job, a service or an environment. Each VM has its own network helper on the Mac, which lets through only the connections its network rules allow: the internet by default, anything else only when you grant it.</desc>
<rect width="1120" height="560" fill="#f7f9fc"/>
<style>
