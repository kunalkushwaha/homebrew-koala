<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">Installing Koala on Linux</title>
<desc id="desc">The Debian package installs Koala under /usr/lib/koala, links /usr/bin/koala, installs its libraries and loads Koala&#x27;s AppArmor profile. Then each user runs koala system install: it checks every file against install.json, copies the manager and helpers into ~/.local/share/koala/versions, pulls and verifies the signed runtime, and writes and starts the systemd user service. An upgrade is the newer package and koala system install again; removal is koala system uninstall, then apt remove.</desc>
<rect width="1120" height="470" fill="#f7f9fc"/>
<style>
 text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
 .heading { font-size:18px; font-weight:650; fill:#17304b; }
 .body { font-size:14px; fill:#465d72; }
 .eyebrow { font-size:12px; font-weight:700; letter-spacing:1.4px; fill:#476889; }
 .label { font-size:13px; fill:#334f6b; }
</style>
<rect x="20" y="20" width="330" height="330" rx="18" fill="#edf3fb" stroke="#bacde2" stroke-width="1.6"/>
<text x="38" y="46" class="eyebrow" text-anchor="start">ONCE, AS ROOT  (sudo apt install)</text>
<rect x="40" y="70" width="290" height="76" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="56" y="104.0" class="heading" text-anchor="start">/usr/lib/koala</text>
<text x="56" y="126.0" class="body" text-anchor="start">the payload, unchanged</text>
<rect x="40" y="160" width="290" height="56" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="56" y="184.0" class="heading" text-anchor="start">/usr/bin/koala</text>
<text x="56" y="206.0" class="body" text-anchor="start">a link to it</text>
<rect x="40" y="230" width="290" height="96" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="56" y="254.0" class="heading" text-anchor="start">/etc/apparmor.d/koala</text>
<text x="56" y="276.0" class="body" text-anchor="start">loaded: lets the manager</text>
<text x="56" y="295.0" class="body" text-anchor="start">and koala-confine create</text>
<text x="56" y="314.0" class="body" text-anchor="start">namespaces</text>
<rect x="380" y="20" width="720" height="330" rx="18" fill="#e8f6f1" stroke="#49a792" stroke-width="1.6"/>
<text x="398" y="46" class="eyebrow" text-anchor="start">EACH USER  (koala system install, no sudo)</text>
<rect x="400" y="60" width="330" height="88" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="416" y="100.0" class="heading" text-anchor="start">1  check</text>
<text x="416" y="122.0" class="body" text-anchor="start">every file against install.json</text>
<rect x="750" y="60" width="330" height="88" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="766" y="90.0" class="heading" text-anchor="start">2  copy</text>
<text x="766" y="112.0" class="body" text-anchor="start">the manager and helpers to</text>
<text x="766" y="131.0" class="body" text-anchor="start">~/.local/share/koala/versions</text>
<rect x="400" y="165" width="330" height="88" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="416" y="195.0" class="heading" text-anchor="start">3  runtime</text>
<text x="416" y="217.0" class="body" text-anchor="start">pulled from ghcr.io; its</text>
<text x="416" y="236.0" class="body" text-anchor="start">signature checked</text>
<rect x="750" y="165" width="330" height="88" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="766" y="195.0" class="heading" text-anchor="start">4  service</text>
<text x="766" y="217.0" class="body" text-anchor="start">a systemd user service,</text>
<text x="766" y="236.0" class="body" text-anchor="start">started</text>
<polyline points="730,104 750,104" fill="none" stroke="#49647f" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="750.0,104.0 739.0,108.5 739.0,99.5" fill="#49647f"/>
<polyline points="915,148 915,157 565,157 565,165" fill="none" stroke="#49647f" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="565.0,165.0 560.5,154.0 569.5,154.0" fill="#49647f"/>
<polyline points="730,209 750,209" fill="none" stroke="#49647f" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="750.0,209.0 739.0,213.5 739.0,204.5" fill="#49647f"/>
<polyline points="330,108 400,104" fill="none" stroke="#49647f" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="400.0,104.0 389.3,109.1 388.8,100.1" fill="#49647f"/>
<text x="740" y="285" class="label" text-anchor="middle">Upgrade: the newer package, then koala system install again (until</text>
<text x="740" y="305" class="label" text-anchor="middle">then the previous manager keeps running). VMs, volumes and images stay.</text>
<text x="740" y="330" class="label" text-anchor="middle">Lingering (loginctl enable-linger) keeps VMs running after you log out.</text>
<rect x="20" y="380" width="1080" height="64" rx="12" fill="#fbeceb" stroke="#c0392b" stroke-width="1.5"/>
<text x="560.0" y="418.0" class="heading" text-anchor="middle">Removing: koala system uninstall [--purge --yes] as each user, then sudo apt remove koala</text>
</svg>
