<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">A VM&#x27;s network on Linux</title>
<desc id="desc">The VM&#x27;s network card is a virtio-net device that cloud-hypervisor serves through the koala-net network device, inside the VM&#x27;s namespaces, which have no network of their own. The device hands each frame over a Unix socket to the VM&#x27;s koala-net session, on the host&#x27;s network, which applies the VM&#x27;s rules: the internet by default, your computer&#x27;s services, the LAN and published ports only as you grant them. No TAP device and no root are needed.</desc>
<rect width="1120" height="420" fill="#f7f9fc"/>
<style>
 text { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
 .heading { font-size:18px; font-weight:650; fill:#17304b; }
 .body { font-size:14px; fill:#465d72; }
 .eyebrow { font-size:12px; font-weight:700; letter-spacing:1.4px; fill:#476889; }
 .label { font-size:13px; fill:#334f6b; }
</style>
<rect x="20" y="20" width="620" height="300" rx="18" fill="#fdf6e9" stroke="#c9a25a" stroke-width="1.6"/>
<text x="38" y="46" class="eyebrow" text-anchor="start">THE VM&#x27;S NAMESPACES  (no network)</text>
<rect x="45" y="75" width="170" height="96" rx="12" fill="#e8f6f1" stroke="#49a792" stroke-width="1.5"/>
<text x="61" y="109.0" class="heading" text-anchor="start">the VM</text>
<text x="61" y="131.0" class="body" text-anchor="start">eth0</text>
<text x="61" y="150.0" class="body" text-anchor="start">(virtio-net)</text>
<rect x="245" y="75" width="170" height="96" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="261" y="109.0" class="heading" text-anchor="start">cloud-hypervisor</text>
<text x="261" y="131.0" class="body" text-anchor="start">the device&#x27;s</text>
<text x="261" y="150.0" class="body" text-anchor="start">frontend</text>
<rect x="445" y="75" width="170" height="96" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="461" y="109.0" class="heading" text-anchor="start">koala-net device</text>
<text x="461" y="131.0" class="body" text-anchor="start">vhost-user</text>
<text x="461" y="150.0" class="body" text-anchor="start">backend</text>
<polyline points="215,123 245,123" fill="none" stroke="#49647f" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="245.0,123.0 234.0,127.5 234.0,118.5" fill="#49647f"/>
<polygon points="215.0,123.0 226.0,118.5 226.0,127.5" fill="#49647f"/>
<polyline points="415,123 445,123" fill="none" stroke="#49647f" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="445.0,123.0 434.0,127.5 434.0,118.5" fill="#49647f"/>
<polygon points="415.0,123.0 426.0,118.5 426.0,127.5" fill="#49647f"/>
<text x="430" y="196" class="label" text-anchor="middle">vhost-user</text>
<text x="430" y="214" class="label" text-anchor="middle">socket</text>
<text x="652" y="196" class="label" text-anchor="middle">frames over</text>
<text x="652" y="214" class="label" text-anchor="middle">a Unix socket</text>
<rect x="690" y="75" width="220" height="96" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="706" y="109.0" class="heading" text-anchor="start">koala-net session</text>
<text x="706" y="131.0" class="body" text-anchor="start">the VM&#x27;s rules,</text>
<text x="706" y="150.0" class="body" text-anchor="start">on the host&#x27;s network</text>
<polyline points="615,140 650,140 650,123 690,123" fill="none" stroke="#49647f" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="690.0,123.0 679.0,127.5 679.0,118.5" fill="#49647f"/>
<polygon points="615.0,140.0 626.0,135.5 626.0,144.5" fill="#49647f"/>
<rect x="690" y="220" width="400" height="64" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="890.0" y="258.0" class="heading" text-anchor="middle">internet, host services, LAN</text>
<polyline points="800,171 800,220" fill="none" stroke="#00897b" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="800.0,220.0 795.5,209.0 804.5,209.0" fill="#00897b"/>
<text x="812" y="205" class="label" text-anchor="start">only what the VM&#x27;s rules allow</text>
<rect x="945" y="75" width="145" height="96" rx="12" fill="#ffffff" stroke="#cfdae5" stroke-width="1.5"/>
<text x="961" y="109.0" class="heading" text-anchor="start">published</text>
<text x="961" y="131.0" class="body" text-anchor="start">ports: in</text>
<text x="961" y="150.0" class="body" text-anchor="start">as granted</text>
<polyline points="945,123 910,123" fill="none" stroke="#49647f" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="910.0,123.0 921.0,118.5 921.0,127.5" fill="#49647f"/>
<text x="570" y="360" class="label" text-anchor="middle">No TAP device, no bridge and no root: the guest&#x27;s traffic leaves only through the session.</text>
</svg>
